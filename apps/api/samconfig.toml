version = 0.1

# Local Development
[local.build.parameters]
use_container = false
parallel = true

[local.local_start_api.parameters]
host = "localhost"
port = 3333
warm_containers = "EAGER"

# Production
[prod.build.parameters]
use_container = false
parallel = true

[prod.deploy.parameters]
stack_name = "react-hono-sam-template"
region = "ap-northeast-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
s3_prefix = "sam"
tags = "Project=react-hono-sam-template Environment=prod"
