services:
  # DynamoDB Local - a full DynamoDB emulation for offline development
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: rh-dynamodb-local
    ports:
      - "8000:8000"
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    user: root
    volumes:
      - dynamodb-data:/data

  # One-shot container that waits for DynamoDB Local, then ensures the
  # users-local table exists. Uses describe-table for idempotency so that
  # create-table errors (bad IAM, malformed schema, dead endpoint) surface
  # instead of being masked as "already exists".
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: rh-dynamodb-init
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-northeast-1
      ENDPOINT: http://dynamodb-local:8000
      TABLE_NAME: users-local
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail

        echo "Waiting for DynamoDB Local..."
        until aws dynamodb list-tables --endpoint-url "$$ENDPOINT" > /dev/null 2>&1; do
          sleep 1
        done
        echo "DynamoDB Local is ready."

        if aws dynamodb describe-table --table-name "$$TABLE_NAME" --endpoint-url "$$ENDPOINT" > /dev/null 2>&1; then
          echo "Table $$TABLE_NAME already exists."
          exit 0
        fi

        echo "Creating table $$TABLE_NAME..."
        # No stderr suppression: real failures (bad IAM, malformed schema, etc.) surface.
        aws dynamodb create-table \
          --table-name "$$TABLE_NAME" \
          --attribute-definitions AttributeName=id,AttributeType=S \
          --key-schema AttributeName=id,KeyType=HASH \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url "$$ENDPOINT"
        echo "Created table $$TABLE_NAME."

volumes:
  dynamodb-data:
